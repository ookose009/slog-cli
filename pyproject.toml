[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "slog-cli"
version = "0.1.0"
description = "Selenium test log analyzer — cluster failures, detect flaky tests, generate reports"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "click>=8.1",
    "rich>=13.0",
    "pytest-json-report>=1.5",
]

[project.optional-dependencies]
selenium = [
    "selenium>=4.15",
    "webdriver-manager>=4.0",
    "pytest-html>=4.0",
    "pytest-rerunfailures>=12.0",
]
dev = [
    "pytest>=7.4",
    "pytest-json-report>=1.5",
]

[project.scripts]
slog = "slog.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["slog*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
